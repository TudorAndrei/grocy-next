server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;
    types {
        font/ttf ttf;
    }
    client_max_body_size 20m;
    location ~ ^__GROCY_WEB_ROUTE_REGEX__login$ {
        error_page 418 = @grocy_login;
        if ($request_method !~ "^(GET|HEAD)$") { return 418; }
        try_files /index.html =404;
    }
    location @grocy_login {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ~ ^__GROCY_WEB_ROUTE_REGEX__logout$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ~ ^__GROCY_WEB_ROUTE_REGEX__(?:(?:product|recipe|chore|battery|stockentry)/[^/]+/grocycode|stockentry/[^/]+/label|manifest)$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location __GROCY_WEB_BASE__assets/ {
        alias /usr/share/nginx/html/assets/;
    }
    location __GROCY_WEB_BASE__vendor/ {
        alias /usr/share/nginx/html/vendor/;
    }
    location __GROCY_WEB_BASE__uisounds/ {
        alias /usr/share/nginx/html/uisounds/;
    }
    location __GROCY_WEB_BASE__img/ {
        alias /usr/share/nginx/html/img/;
    }
    location = __GROCY_WEB_BASE__api {
        try_files /index.html =404;
    }
    location ~ ^__GROCY_WEB_ROUTE_REGEX__api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ~ ^__GROCY_WEB_ROUTE_REGEX__files/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
