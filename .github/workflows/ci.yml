name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync
        run: uv sync
      - name: Ruff
        run: uv run ruff check src tests
      - name: Typecheck
        run: uv run basedpyright
      - name: Test
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  php-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install PHP modules
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-curl php-gd php-intl php-mbstring php-sqlite3 php-xml php-zip
      - name: Sync backend
        run: uv sync --project backend --frozen
      - name: Compare with Grocy 4.5.0
        run: uv run --project backend python scripts/check-reference.py
