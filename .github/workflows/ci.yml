name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Sync
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check --config pyproject.toml . ../scripts
      - name: Format
        run: uv run ruff format --config pyproject.toml --check . ../scripts
      - name: Typecheck
        run: uv run ty check . ../scripts --error-on-warning
      - name: Test
        run: uv run pytest
        env:
          GROCY_USE_NATIVE_PHP: "false"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  php-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        timezone: [UTC, Europe/Bucharest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Install PHP modules
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli php-bcmath php-curl php-gd php-intl php-mbstring php-sqlite3 php-xml php-zip
      - name: Sync backend
        run: uv sync --project backend --frozen
      - name: Compare with Grocy 4.5.0
        env:
          GROCY_USE_NATIVE_PHP: "false"
        run: uv run --project backend python scripts/check-reference.py --timezone "${{ matrix.timezone }}"
      - name: Compare disabled feature flags
        env:
          GROCY_USE_NATIVE_PHP: "false"
          PYTEST_ADDOPTS: -k disabled_feature_flags
        run: >-
          uv run --project backend python scripts/check-reference.py
          --timezone "${{ matrix.timezone }}"
          --feature-flag TASKS=false --feature-flag CHORES=false
          --feature-flag BATTERIES=false --feature-flag RECIPES_MEALPLAN=false
          --feature-flag STOCK_BEST_BEFORE_DATE_TRACKING=false
          --feature-flag STOCK_PRODUCT_FREEZING=false --feature-flag STOCK_PRICE_TRACKING=off
