min_version = "2024.11.1"

[tools]
hk = "2.9.0"
gitleaks = "8.30.1"
rumdl = "0.3.0"
tombi = "1.9.0"
shellcheck = "0.11.0"
python = "3.13"
uv = "latest"

[env]
HK_MISE = "1"
GROCY_USE_NATIVE_PHP = "false"

[hooks]
postinstall = "hk install --mise"

[tasks.setup]
description = "Install Python API dependencies"
run = "cd backend && uv sync --frozen"

[tasks.dev]
description = "Start the Python API"
run = "./scripts/dev.sh"

[tasks.lint]
description = "Check Python lint rules"
run = "cd backend && uv run ruff check --config pyproject.toml . ../scripts"

[tasks.format]
description = "Format Python files"
run = "cd backend && uv run ruff format --config pyproject.toml . ../scripts"

[tasks."format:check"]
description = "Check Python formatting"
run = "cd backend && uv run ruff format --config pyproject.toml --check . ../scripts"

[tasks.typecheck]
description = "Check Python types"
run = "cd backend && uv run ty check . ../scripts --error-on-warning"

[tasks.fix]
description = "Apply safe lint fixes and format all source files"
run = [
  "cd backend && uv run ruff check --config pyproject.toml --fix . ../scripts",
  "cd backend && uv run ruff format --config pyproject.toml . ../scripts",
]

[tasks.check]
description = "Run lint, format, and type checks"
depends = ["lint", "format:check", "typecheck"]
