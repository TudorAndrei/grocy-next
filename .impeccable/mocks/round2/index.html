<title>Grocy Next Redesign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout: one review sheet; a direction switcher, then the desktop frame at full width and the phone frame beside its notes. */
:root {
  --bg: #f3f4f2;
  --panel: #ffffff;
  --fg: #16191a;
  --muted: #5d6462;
  --line: #dfe2df;
  --accent: #1e5b4f;
  --accent-ink: #ffffff;
  --frame: #c9cdca;
  --font: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131615; --panel: #1b1f1e; --fg: #eef1ef; --muted: #a2aaa7; --line: #2c3230;
    --accent: #8fd1bf; --accent-ink: #0f1b18; --frame: #39403e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131615; --panel: #1b1f1e; --fg: #eef1ef; --muted: #a2aaa7; --line: #2c3230;
  --accent: #8fd1bf; --accent-ink: #0f1b18; --frame: #39403e; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px 64px;
}
.wrap { max-width: 1240px; margin: 0 auto; display: grid; gap: 28px; }
header h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 6px; text-wrap: balance; }
header p { margin: 0; color: var(--muted); max-width: 64ch; }
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tabs button {
  font: inherit; font-weight: 500; color: var(--fg); background: var(--panel);
  border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; cursor: pointer;
  display: inline-flex; gap: 10px; align-items: center; min-height: 40px;
}
.tabs button span { color: var(--muted); font-size: 13px; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tabs button[aria-selected="true"] span { color: inherit; opacity: .8; }
.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dir { display: grid; gap: 20px; }
.dir h2 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
.desk {
  position: relative; width: 100%; aspect-ratio: 1440 / 900; max-width: 100%;
  border: 1px solid var(--frame); border-radius: 12px; overflow: hidden; background: var(--panel);
  box-shadow: 0 12px 32px -18px rgb(0 0 0 / .35);
}
.desk iframe, .phone iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; }
.desk iframe { width: 1440px; height: 900px; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 32px; align-items: start; }
.notes { display: grid; gap: 14px; min-width: 0; max-width: 62ch; }
.notes p { margin: 0; }
.notes dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 8px 16px; }
.notes dt { color: var(--muted); font-size: 13px; padding-top: 1px; }
.notes dd { margin: 0; }
.phone {
  position: relative; width: 390px; aspect-ratio: 390 / 844; max-width: 100%;
  border: 1px solid var(--frame); border-radius: 28px; overflow: hidden; background: var(--panel);
  box-shadow: 0 12px 32px -18px rgb(0 0 0 / .35);
}
.phone iframe { width: 390px; height: 844px; }
.open { font-size: 13px; color: var(--muted); }
.open a { color: var(--accent); text-underline-offset: 3px; }
@media (max-width: 760px) { .row { grid-template-columns: minmax(0, 1fr); } .phone { justify-self: center; } }
</style>

<div class="wrap">
  <header>
    <h1>Grocy Next redesign: second round</h1>
    <p>Four directions for the Stock screen, from calm to bold. Each one uses the same household data (today is Sunday 8 November 2026). Choose one and it gets carried through Shopping, Meals and Chores on desktop and phone.</p>
  </header>

  <div class="tabs" role="tablist" aria-label="Directions" id="tabs"></div>
  <section class="dir" id="dir" aria-live="polite"></section>
</div>

<script>
const DIRS = [
  { id: "precision", name: "Quiet Precision", tone: "Calm",
    lede: "A near-monochrome, keyboard-friendly tool. One saffron accent used sparingly; the character comes from exact type and density.",
    move: "A freshness ruler under the header places every dated product on one 30-day timeline, so you see the whole week's pressure in one line.",
    feel: "Linear or Things: precise, quiet, fast.",
    risk: "Closest to today's plain look; it depends on precision to feel finished." },
  { id: "glaze", name: "Studio Glaze", tone: "Warm and calm",
    lede: "Soft porcelain ground, a deep celadon shell and glaze-toned colours for each area. Rounded and tactile, still dense enough to scan.",
    move: "Freshness is a colour: each product carries a swatch that moves from celadon to honey to copper as its date nears, and a pour bar sums up the whole pantry.",
    feel: "A well-made homeware brand's app.",
    risk: "A colour ramp needs its labels; colour alone never carries the state." },
  { id: "forecast", name: "Freshness Forecast", tone: "Lively",
    lede: "Borrowed from modern weather apps: big light numerals, a calm atmospheric header, condition colours that mean something.",
    move: "Stock opens on a 7-day use-by forecast. Each day shows how many items reach their date and which ones, then a Use first list below.",
    feel: "Glanceable on a phone; the week ahead at a look.",
    risk: "Familiar weather-app shape; the forecast must stay a list you can act on." },
  { id: "block", name: "Colour Block", tone: "Bold",
    lede: "Each area owns a soft, saturated field colour: sage for Stock, butter for Shopping, powder blue for Meals, lilac for Chores.",
    move: "Stock is shown as shelves: Fridge, Freezer and Pantry side by side, with anything needing attention floating to the top of its shelf.",
    feel: "Confident and friendly, like contemporary Scandinavian homeware.",
    risk: "Strong fields can tire on long sessions; desktop planning needs the quieter panels." },
];
const tabs = document.getElementById("tabs");
const dir = document.getElementById("dir");
let current = DIRS[0].id;
try { const h = location.hash.slice(1); if (DIRS.some(d => d.id === h)) current = h; } catch (e) {}

function fit() {
  document.querySelectorAll("[data-fit]").forEach(box => {
    const f = box.querySelector("iframe");
    const w = Number(box.dataset.fit);
    f.style.transform = `scale(${box.clientWidth / w})`;
  });
}
function render() {
  tabs.innerHTML = "";
  DIRS.forEach(d => {
    const b = document.createElement("button");
    b.role = "tab"; b.id = "tab-" + d.id;
    b.setAttribute("aria-selected", String(d.id === current));
    b.innerHTML = `${d.name}<span>${d.tone}</span>`;
    b.onclick = () => { current = d.id; try { history.replaceState(null, "", "#" + d.id); } catch (e) {} render(); };
    tabs.appendChild(b);
  });
  const d = DIRS.find(x => x.id === current);
  dir.innerHTML = `
    <h2>${d.name}</h2>
    <div class="desk" data-fit="1440"><iframe title="${d.name}, desktop" src="${d.id}-desktop.html" loading="lazy"></iframe></div>
    <p class="open">Desktop at 1440 × 900. <a href="${d.id}-desktop.html" target="_blank" rel="noopener">Open full size</a></p>
    <div class="row">
      <div class="notes">
        <p>${d.lede}</p>
        <dl>
          <dt>Signature</dt><dd>${d.move}</dd>
          <dt>Feels like</dt><dd>${d.feel}</dd>
          <dt>Risk</dt><dd>${d.risk}</dd>
        </dl>
      </div>
      <div class="phone" data-fit="390"><iframe title="${d.name}, phone" src="${d.id}-phone.html" loading="lazy"></iframe></div>
    </div>`;
  fit();
}
window.addEventListener("resize", fit);
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (DIRS.some(d => d.id === h)) { current = h; render(); } });
render();
</script>
