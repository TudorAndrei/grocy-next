[project]
name = "grocy"
version = "0.1.0"
description = "Grocy-compatible household management with FastAPI, FastMCP, and nutrition extensions"
readme = "README.md"
requires-python = ">=3.13"
authors = [
  { name = "TudorAndrei", email = "tudorandrei.dumitrascu@gmail.com" },
]
dependencies = [
  "aiosqlite>=0.22.0",
  "alembic>=1.20.1",
  "bcrypt>=5.0.0",
  "fastapi>=0.159.1",
  "fastmcp>=4.1.3",
  "greenlet>=3.0.0",
  "httpx>=0.28.0",
  "nh3>=0.3.7",
  "pillow>=11,<14",
  "pydantic>=2.14.1",
  "pydantic-settings>=2.16.1",
  "python-magic>=0.4.27",
  "regex>=2024.11.6",
  "sqlalchemy[asyncio]>=2.1.6",
  "uvicorn[standard]>=0.54.0",
]

[project.scripts]
grocy = "grocy.main:run"
grocy-cli = "grocy.cli:main"
grocy-mcp = "grocy.cli:cmd_mcp_entry"

[dependency-groups]
dev = [
  "hypothesis>=6.170.5",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.17.1",
  "ty>=0.0.92",
  "types-regex>=2026.9.29.20261017",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/grocy/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["grocy", "php_runtime"]

[tool.ty.src]
exclude = ["src/grocy/_vendor"]

[tool.uv]
default-groups = ["dev"]
