[project]
name = "grocy"
version = "0.1.0"
description = "Grocy-compatible household management with FastAPI, FastMCP, and nutrition extensions"
readme = "README.md"
authors = [
    { name = "TudorAndrei", email = "tudorandrei.dumitrascu@gmail.com" },
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.159.1",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "greenlet>=3.0.0",
    "aiosqlite>=0.22.0",
    "alembic>=1.20.1",
    "httpx>=0.28.0",
    "fastmcp>=4.1.3",
    "pillow>=11,<14",
    "regex>=2024.11.6",
    "bcrypt>=5.0.0",
]

[project.scripts]
grocy = "grocy.main:run"
grocy-cli = "grocy.cli:main"
grocy-mcp = "grocy.cli:cmd_mcp_entry"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "hypothesis>=6.170.5",
    "ruff>=0.17.1",
    "ty>=0.0.92",
    "types-regex>=2026.9.29.20261017",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/grocy/_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["grocy"]

[tool.ty.src]
exclude = ["src/grocy/_vendor"]
