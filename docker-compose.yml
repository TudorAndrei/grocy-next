services:
  api:
    build: ./backend
    expose:
      - "8000"
    environment:
      GROCY_HOST: "0.0.0.0"
      GROCY_PORT: "8000"
      GROCY_DATABASE_URL: "sqlite+aiosqlite:////data/grocy.db"
      GROCY_FILES_ROOT: "/data/files"
      GROCY_SEED_DEMO_DATA: "${GROCY_SEED_DEMO_DATA:-true}"
      GROCY_DEV_OPEN_API_KEY: "${GROCY_DEV_OPEN_API_KEY:-dev-key}"
      GROCY_SETUP_TOKEN: "${GROCY_SETUP_TOKEN:-}"
    volumes:
      - grocy-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  web:
    build: ./frontend
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  grocy-data:
